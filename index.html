<style>
  :root{box-sizing:border-box;
    --cyan:#5df0d0;--cyan-soft:#aeffe6;--violet:#c08bff;--ink:#dffaf0;--ink-dim:#6fa396;--danger:#ff6b8a;
    --font:'Space Grotesk',system-ui,-apple-system,sans-serif}
  *{box-sizing:inherit;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);
    background:
      radial-gradient(120% 80% at 50% 42%, #0a0f14 0%, #05070b 55%, #020304 100%);
    color:var(--ink);min-height:100%;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .stage{position:relative;width:100%;max-width:580px;flex:1;display:flex;flex-direction:column;align-items:center;padding:18px 20px 0}
  header{text-align:center;z-index:2}
  .name{font-size:13px;letter-spacing:.42em;color:var(--cyan-soft);text-indent:.42em}
  .tagline{font-size:12px;color:var(--ink-dim);margin-top:6px;min-height:16px;transition:color .3s}
  .projector{position:relative;width:100%;aspect-ratio:1/1;max-height:50vh;margin:2px 0;isolation:isolate}
  /* cono de luz que sube desde la base, como un proyector */
  .projector::before{content:"";position:absolute;left:50%;bottom:3%;width:64%;height:72%;transform:translateX(-50%);z-index:0;pointer-events:none;
    background:conic-gradient(from 180deg at 50% 100%,transparent 72deg,rgba(93,240,208,.10) 90deg,rgba(174,255,230,.18) 180deg,rgba(93,240,208,.10) 270deg,transparent 288deg);
    -webkit-mask-image:linear-gradient(to top,#000,transparent 86%);mask-image:linear-gradient(to top,#000,transparent 86%);
    filter:blur(7px);opacity:.6}
  #holo{position:relative;width:100%;height:100%;display:block;z-index:1}
  /* líneas de escaneo + parpadeo holográfico */
  .projector::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;mix-blend-mode:screen;opacity:.5;
    background:repeating-linear-gradient(to bottom,rgba(93,240,208,.08) 0,rgba(93,240,208,.08) 1px,transparent 1px,transparent 2px);
    animation:holoGlitch 6s linear infinite}
  /* barrido horizontal brillante que recorre el holograma */
  .scan{position:absolute;left:0;right:0;height:10%;z-index:2;pointer-events:none;mix-blend-mode:screen;box-shadow:0 0 12px rgba(93,240,208,.4);
    background:linear-gradient(to bottom,transparent,rgba(174,255,230,.22) 45%,rgba(255,255,255,.38) 50%,rgba(174,255,230,.22) 55%,transparent);

  /* marco HUD con esquinas tipo interfaz */

    --c:rgba(93,240,208,.6);--s:22px;--t:1.5px;

      linear-gradient(var(--c),var(--c)) top left/var(--s) var(--t) no-repeat,
      linear-gradient(var(--c),var(--c)) top left/var(--t) var(--s) no-repeat,
      linear-gradient(var(--c),var(--c)) top right/var(--s) var(--t) no-repeat,
      linear-gradient(var(--c),var(--c)) top right/var(--t) var(--s) no-repeat,
      linear-gradient(var(--c),var(--c)) bottom left/var(--s) var(--t) no-repeat,
      linear-gradient(var(--c),var(--c)) bottom left/var(--t) var(--s) no-repeat,
      linear-gradient(var(--c),var(--c)) bottom right/var(--s) var(--t) no-repeat,
      linear-gradient(var(--c),var(--c)) bottom right/var(--t) var(--s) no-repeat;

  @keyframes hudPulse{50%{opacity:.85}}
  /* glitch cromático RGB-split (activado desde JS en las ráfagas) */

  /* lecturas HUD en las esquinas */
  .hud-txt{position:absolute;z-index:4;pointer-events:none;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:10px;letter-spacing:.16em;color:rgba(93,240,208,.72);text-shadow:0 0 6px rgba(93,240,208,.5);animation:hudFlk 4s steps(30) infinite}
  .hud-txt.tl{top:14px;left:18px}.hud-txt.tr{top:14px;right:18px}.hud-txt.bl{bottom:14px;left:18px}.hud-txt.br{bottom:14px;right:18px}
  @keyframes hudFlk{0%,46%,49%,100%{opacity:.72}47%{opacity:.28}48%{opacity:.72}}
  /* parpadeo + sacudida glitch tipo proyección */
  @keyframes holoGlitch{
    0%,46%,52%,82%,85%,100%{opacity:.5;transform:translateX(0)}
    48%{opacity:.78;transform:translateX(-2px)} 49%{opacity:.3;transform:translateX(2px)} 50%{opacity:.7;transform:translateX(-1px)}
    83%{opacity:.82;transform:translateX(3px)} 84%{opacity:.34;transform:translateX(-3px)}}
  .feed{width:100%;flex:1;min-height:80px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px 14px;z-index:2;
    -webkit-mask-image:linear-gradient(to bottom,transparent,#000 18px);mask-image:linear-gradient(to bottom,transparent,#000 18px)}
  .line{font-size:15px;line-height:1.5;opacity:0;transform:translateY(6px);animation:rise .4s forwards}
  @keyframes rise{to{opacity:1;transform:none}}

  .line.nova .who{color:var(--cyan)} .line.nova{color:var(--cyan-soft)}
  .line.sys{color:var(--ink-dim);font-size:13px;text-align:center} .line.sys.err{color:var(--danger)}

  .mic{position:relative;width:82px;height:82px;border-radius:50%;border:1px solid rgba(93,240,208,.35);

    display:grid;place-items:center;transition:transform .15s,border-color .25s,box-shadow .25s;-webkit-tap-highlight-color:transparent}

</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <main class="stage">
    <header><div class="name">N O V A</div><div class="tagline" id="status">Toca el micrófono y háblame</div></header>
    <div class="projector"><canvas id="holo"></canvas><div class="scan"></div><div class="hud"></div>
      <div class="hud-txt tl">◢ NOVA·CORE</div><div class="hud-txt tr" id="hudStat">◆ SYNC 100%</div>
      <div class="hud-txt bl" id="hudHex">0x5DF0D0</div><div class="hud-txt br">◤ GLASS v2</div></div>
    <div class="feed" id="feed" aria-live="polite"></div>
  </main>
  <div class="dock">
    <button class="mic" id="mic" aria-label="Hablar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="22"/></svg>
    </button>
    <div class="mic-label" id="micLabel">Toca para hablar</div>
    <div class="row"><input class="txt" id="txt" placeholder="…o escríbeme aquí" autocomplete="off"><button class="send" id="send">Enviar</button></div>
    <div class="row"><select class="txt" id="voiceSel" style="padding:10px 14px;cursor:pointer" aria-label="Elegir voz"></select></div>
    <div class="toggles">

      <label><input type="checkbox" id="mute"> Silenciar voz</label>
    </div>

<script>
/* ===== Estado ===== */
const S={IDLE:'idle',LISTEN:'listen',THINK:'think',SPEAK:'speak'};
let state=S.IDLE, level=0, targetLevel=0.08;
const history=[];
const el=id=>document.getElementById(id);
const feed=el('feed'),statusEl=el('status'),micBtn=el('mic'),micLabel=el('micLabel');

/* ===== Holograma de vidrio con anillos orbitales ===== */
const canvas=el('holo');
const lerp=(a,b,k)=>a+(b-a)*k;
let tdBuf=null;                         // (el micrófono lo rellena; sin uso aquí)
let DPR;
const reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;

let renderer,scene,camera,root,blob,blobGeo,basePos,mirror,core,particles,halo,shell,grid,scanRing,ticks;
const rings=[];
const arcs=[];

function makeGlassMat(tint,rim){
  return new THREE.ShaderMaterial({
    transparent:true, side:THREE.DoubleSide, depthWrite:false, blending:THREE.NormalBlending,
    uniforms:{
      uTint:{value:new THREE.Color(tint[0],tint[1],tint[2])},
      uRim:{value:new THREE.Color(rim[0],rim[1],rim[2])},
      uTime:{value:0}, uLevel:{value:0}
    },
    vertexShader:`varying vec3 vN; varying vec3 vView; varying vec3 vPos;
      void main(){ vec4 mv=modelViewMatrix*vec4(position,1.0); vView=-mv.xyz; vN=normalize(normalMatrix*normal); vPos=position; gl_Position=projectionMatrix*mv; }`,
    fragmentShader:`precision highp float; uniform vec3 uTint,uRim; uniform float uTime,uLevel; varying vec3 vN; varying vec3 vView; varying vec3 vPos;
      // tornasol tipo pelicula delgada
      vec3 irid(float t){ return 0.5+0.5*cos(6.28318*(t + vec3(0.0,0.33,0.67))); }
      void main(){
        vec3 N=normalize(vN); vec3 V=normalize(vView);
        float f=pow(1.0-max(dot(N,V),0.0),2.3);
        vec3 R=reflect(-V,N);
        float g1=pow(max(dot(R,normalize(vec3(0.5,0.8,0.6))),0.0),30.0);
        float g2=pow(max(dot(R,normalize(vec3(-0.6,-0.3,0.7))),0.0),16.0);
        float top=smoothstep(-0.3,1.0,N.y);
        vec3 col=mix(uTint*0.10, uRim, f);
        // borde cromatico iridiscente
        vec3 ir=irid(f*1.3 + N.y*0.25 + uTime*0.04);
        col=mix(col, col*ir*1.7, f*0.72);
        col+=g1*1.6+g2*0.6; col+=uTint*top*0.12;
        // bandas holograficas internas que reaccionan al nivel de voz
        float bands=0.5+0.5*sin(vPos.y*26.0 - uTime*2.0);
        col+=uRim*bands*0.06*(0.4+uLevel);
        float a=clamp(f*0.85+g1+g2*0.5+0.12,0.0,1.0);
        gl_FragColor=vec4(col,a);
      }`
  });
}

// textura radial para el halo/resplandor
function glowTex(){
  const c=document.createElement('canvas'); c.width=c.height=128;
  const g=c.getContext('2d');
  const grd=g.createRadialGradient(64,64,0,64,64,64);
  grd.addColorStop(0,'rgba(150,255,228,0.95)');
  grd.addColorStop(0.3,'rgba(93,240,208,0.35)');
  grd.addColorStop(1,'rgba(93,240,208,0)');
  g.fillStyle=grd; g.fillRect(0,0,128,128);
  const tex=new THREE.CanvasTexture(c); return tex;
}

function initGlass(){
  if(typeof THREE==='undefined'){return false;}
  DPR=Math.min(window.devicePixelRatio||1,2);
  const r=canvas.getBoundingClientRect();
  renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
  renderer.setPixelRatio(DPR); renderer.setSize(r.width,r.height,false);
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(40, r.width/r.height, 0.1, 100);
  camera.position.set(0,0,4.7);
  root=new THREE.Group(); scene.add(root);

  // cristal facetado (gema holográfica) en vez de esfera: caras planas = aspecto más futurista y limpio
  blobGeo=new THREE.IcosahedronGeometry(1.12, 1).toNonIndexed();
  blobGeo.computeVertexNormals();
  basePos=blobGeo.attributes.position.array.slice();

  blob=new THREE.Mesh(blobGeo, makeGlassMat([0.55,1.0,0.85],[0.78,1.0,0.92]));
  root.add(blob);

  // núcleo interno luminoso (aditivo) que late con la voz
  core=new THREE.Mesh(new THREE.SphereGeometry(0.72,48,48), new THREE.ShaderMaterial({
    transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.BackSide,
    uniforms:{uColor:{value:new THREE.Color(0.55,1.0,0.85)}, uLevel:{value:0}},
    vertexShader:`varying vec3 vN; varying vec3 vView; void main(){vec4 mv=modelViewMatrix*vec4(position,1.0);vView=-mv.xyz;vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`precision highp float; uniform vec3 uColor; uniform float uLevel; varying vec3 vN; varying vec3 vView;
      void main(){ vec3 N=normalize(vN),V=normalize(vView); float f=pow(1.0-max(dot(N,V),0.0),2.0);
        float a=f*(0.30+uLevel*0.95); gl_FragColor=vec4(uColor*(0.6+uLevel),a); }`
  }));
  root.add(core);

  // reflejo tenue en el suelo (misma geometría deformada, invertida)
  mirror=new THREE.Mesh(blobGeo, makeGlassMat([0.10,0.20,0.16],[0.20,0.33,0.30]));
  mirror.scale.y=-1; mirror.position.y=-2.7;
  root.add(mirror);

  // campo de partículas orbitando en una capa esférica
  const PCOUNT=150, pg=new THREE.BufferGeometry(), parr=new Float32Array(PCOUNT*3);
  for(let i=0;i<PCOUNT;i++){
    const rr=1.35+Math.random()*0.75, th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
    parr[i*3]=rr*Math.sin(ph)*Math.cos(th); parr[i*3+1]=rr*Math.cos(ph); parr[i*3+2]=rr*Math.sin(ph)*Math.sin(th);
  }
  pg.setAttribute('position', new THREE.BufferAttribute(parr,3));
  particles=new THREE.Points(pg, new THREE.PointsMaterial({color:0xaeffe6,size:0.028,transparent:true,opacity:0.7,blending:THREE.AdditiveBlending,depthWrite:false}));
  root.add(particles);

  // halo/resplandor detrás del blob (fake bloom)
  halo=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex(),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,opacity:0.5}));
  halo.scale.set(4.4,4.4,1); scene.add(halo);

  // malla wireframe que envuelve la esfera (objeto "escaneado")
  shell=new THREE.Mesh(new THREE.IcosahedronGeometry(1.55,2),
    new THREE.MeshBasicMaterial({color:0x7fffe0,wireframe:true,transparent:true,opacity:0.14,blending:THREE.AdditiveBlending,depthWrite:false}));
  root.add(shell);

  // arcos tipo HUD (segmentos de carga) girando
  [{r:1.72,seg:Math.PI*0.62,tl:[1.2,0.3,0]},{r:2.18,seg:Math.PI*0.45,tl:[0.4,1.1,0.6]}].forEach(a=>{
    const g=new THREE.TorusGeometry(a.r,0.013,8,90,a.seg);
    const m=new THREE.Mesh(g, new THREE.MeshBasicMaterial({color:0xaeffe6,transparent:true,opacity:0.75,blending:THREE.AdditiveBlending,depthWrite:false}));
    m.rotation.set(a.tl[0],a.tl[1],a.tl[2]); root.add(m); arcs.push(m);
  });

  // rejilla en perspectiva en la base (estética sci-fi)
  grid=new THREE.GridHelper(11,22,0x5df0d0,0x1c5f52);
  grid.material.transparent=true; grid.material.opacity=0.16; grid.material.depthWrite=false;
  grid.position.y=-2.15; root.add(grid);

  // plano de escaneo: anillo brillante que recorre la esfera como un escáner 3D
  scanRing=new THREE.Mesh(new THREE.TorusGeometry(1.0,0.012,8,110),
    new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.6,blending:THREE.AdditiveBlending,depthWrite:false}));
  scanRing.rotation.x=Math.PI/2; root.add(scanRing);

  // anillo de marcas tipo radar/dial frente a cámara
  const tv=[], TN=56;
  for(let i=0;i<TN;i++){ const a=i/TN*Math.PI*2, r0=2.28, r1=(i%4===0)?2.42:2.34;
    tv.push(Math.cos(a)*r0,Math.sin(a)*r0,0, Math.cos(a)*r1,Math.sin(a)*r1,0); }
  const tickG=new THREE.BufferGeometry(); tickG.setAttribute('position',new THREE.Float32BufferAttribute(tv,3));
  ticks=new THREE.LineSegments(tickG, new THREE.LineBasicMaterial({color:0x5df0d0,transparent:true,opacity:0.4,blending:THREE.AdditiveBlending,depthWrite:false}));
  root.add(ticks);

  // anillos orbitales
  const tilts=[[Math.PI/2,0,0],[Math.PI/2.1,0.5,0.2],[0.6,1.15,0.9]];
  tilts.forEach((tl,i)=>{
    const g=new THREE.TorusGeometry(1.95, 0.008, 10, 180);
    const m=new THREE.Mesh(g, new THREE.MeshBasicMaterial({color:0xbfeede, transparent:true, opacity:0.5, blending:THREE.AdditiveBlending, depthWrite:false}));
    m.rotation.set(tl[0],tl[1],tl[2]);
    root.add(m); rings.push(m);
    const bead=new THREE.Mesh(new THREE.SphereGeometry(0.045,16,16), new THREE.MeshBasicMaterial({color:0xffffff}));
    bead.position.set(1.95,0,0); m.add(bead);
  });

  window.addEventListener('resize', onResize);
  return true;
}
function onResize(){const r=canvas.getBoundingClientRect(); renderer.setSize(r.width,r.height,false);
  camera.aspect=r.width/r.height; camera.updateProjectionMatrix();}

function morph(time, amp){
  const p=blobGeo.attributes.position.array;
  for(let k=0;k<p.length;k+=3){
    const bx=basePos[k],by=basePos[k+1],bz=basePos[k+2];
    const len=Math.sqrt(bx*bx+by*by+bz*bz);
    const nx=bx/len,ny=by/len,nz=bz/len;
    const d= Math.sin(nx*2.0+time*0.9)*0.18
           + Math.sin(ny*3.0-time*0.7)*0.14
           + Math.sin(nz*2.5+time*1.1)*0.12
           + Math.sin((nx+ny+nz)*3.0+time*0.5)*0.10
           + Math.sin(ny*9.0-time*6.0)*0.06*glitchAmp;   // sacudida glitch
    const disp=1.0+(0.12+amp*0.45)*d;
    p[k]=nx*len*disp; p[k+1]=ny*len*disp; p[k+2]=nz*len*disp;
  }
  blobGeo.attributes.position.needsUpdate=true;
  blobGeo.computeVertexNormals();
}

let t=0, glitchAmp=0, lastHud=0;
const TINTS={idle:[0.55,1.0,0.85],listen:[0.5,1.0,0.8],think:[0.74,0.56,1.0],speak:[0.5,1.0,0.9]};
function updateHud(){
  const s=el('hudStat'), h=el('hudHex');
  if(s) s.textContent='◆ SYNC '+(94+Math.floor(Math.random()*7))+'%';
  if(h) h.textContent='0x'+Math.floor(Math.random()*0xffffff).toString(16).toUpperCase().padStart(6,'0');
}
function frame(){
  t+=0.016;
  if(!reduce && t-lastHud>0.28){ lastHud=t; updateHud(); }
  if(state===S.THINK) targetLevel=0.5+Math.sin(t*4)*0.2;
  if(state===S.IDLE)  targetLevel=0.12+Math.sin(t*1.1)*0.05;
  level=lerp(level,targetLevel, reduce?0.06:0.12);
  // ráfagas de glitch ocasionales (más probables al hablar/pensar)
  glitchAmp=Math.max(0,glitchAmp-0.08);
  if(!reduce && Math.random()<0.012+level*0.03) glitchAmp=1.0;

  if(renderer){
    // cristal: giro propio y latido limpio (sin deformación ruidosa)
    blob.rotation.y += 0.004+level*0.012; blob.rotation.x += 0.0022;
    const bs=1.0+level*0.14+Math.sin(t*2.0)*0.02+glitchAmp*0.06;
    blob.scale.setScalar(bs);
    mirror.rotation.copy(blob.rotation); mirror.scale.set(bs,-bs,bs);
    const tc=TINTS[state]||TINTS.idle; const col=new THREE.Color(tc[0],tc[1],tc[2]);
    blob.material.uniforms.uTint.value.lerp(col,0.05);
    blob.material.uniforms.uTime.value=t; blob.material.uniforms.uLevel.value=level;
    mirror.material.uniforms.uTime.value=t; mirror.material.uniforms.uLevel.value=level;

    // núcleo: color del estado + latido con el nivel de voz
    core.material.uniforms.uColor.value.lerp(col,0.05);
    core.material.uniforms.uLevel.value=level;
    const cs=0.9+level*0.4+Math.sin(t*2.2)*0.03; core.scale.setScalar(cs);

    // halo: resplandor que respira con el nivel
    halo.material.color.lerp(col,0.05);
    halo.material.opacity=0.32+level*0.5;
    const hs=4.0+level*1.2+Math.sin(t*1.3)*0.1; halo.scale.set(hs,hs,1);

    // partículas: giro más vivo y titileo
    particles.rotation.y -= 0.003+level*0.01; particles.rotation.x = Math.sin(t*0.25)*0.14;
    particles.material.opacity=0.45+level*0.45+Math.sin(t*3.0)*0.08;

    // rotación base más rápida + sacudida durante el glitch
    root.rotation.y += (reduce?0.0012:0.006) + level*0.022 + glitchAmp*0.05*(Math.random()-0.5);
    root.rotation.x = Math.sin(t*0.2)*0.12 + glitchAmp*0.04*(Math.random()-0.5);
    root.rotation.z = Math.sin(t*0.13)*0.05;
    root.position.x = glitchAmp*(Math.random()-0.5)*0.07;
    rings.forEach((m,i)=>{ m.rotation.z += (0.008+0.005*i)*(1+level); m.rotation.y += 0.004*(i+1); });

    // malla wireframe: gira al contrario y palpita con la voz
    shell.rotation.y -= 0.004+level*0.01; shell.rotation.x += 0.002;
    shell.material.opacity=0.10+level*0.22;
    shell.scale.setScalar(1.0+level*0.08+glitchAmp*0.05);

    // arcos HUD girando en sentidos opuestos
    arcs.forEach((m,i)=>{ m.rotation.z += (i?-1:1)*(0.02+level*0.03); });

    // rejilla: ligero desplazamiento y brillo con la voz
    grid.rotation.y += 0.002; grid.material.opacity=0.12+level*0.14;

    // plano de escaneo subiendo y bajando, ajustando su radio al corte de la esfera
    const sy=Math.sin(t*0.9)*1.25; scanRing.position.y=sy;
    const rad=Math.sqrt(Math.max(0.02,1.32*1.32 - sy*sy)); scanRing.scale.set(rad,rad,1);
    scanRing.material.opacity=0.3+level*0.4;

    // anillo de marcas (dial) girando
    ticks.rotation.z += 0.003; ticks.material.opacity=0.3+level*0.3;

    // glitch cromático RGB-split durante las ráfagas
    canvas.classList.toggle('glx', glitchAmp>0.5);
    renderer.render(scene,camera);
  }
  requestAnimationFrame(frame);
}
if(initGlass()) requestAnimationFrame(frame);
else statusEl.textContent='Tu navegador no soporta 3D (WebGL).';

/* ===== UI ===== */
function setState(s){state=s;
  const m={[S.IDLE]:'En reposo · toca para hablar',[S.LISTEN]:'Escuchando…',[S.THINK]:'Pensando…',[S.SPEAK]:'Hablando…'};
  statusEl.textContent=m[s];micBtn.classList.toggle('live',s===S.LISTEN);micBtn.classList.toggle('busy',s===S.THINK);}
function addLine(who,text,cls=''){const d=document.createElement('div');d.className='line '+cls;
  const label={you:'TÚ',nova:'NOVA'}[cls]||'';d.innerHTML=label?`<span class="who">${label}</span>${text}`:text;
  feed.appendChild(d);feed.scrollTop=feed.scrollHeight;return d;}

/* ===== Micrófono ===== */
let audioCtx,analyser,micData,micStream,rafMic;
async function startMicMeter(){try{
  micStream=await navigator.mediaDevices.getUserMedia({audio:true});
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  const src=audioCtx.createMediaStreamSource(micStream);analyser=audioCtx.createAnalyser();analyser.fftSize=512;
  micData=new Uint8Array(analyser.frequencyBinCount);tdBuf=new Uint8Array(analyser.fftSize);src.connect(analyser);
  const loop=()=>{analyser.getByteFrequencyData(micData);let s=0;for(const v of micData)s+=v;
    targetLevel=Math.min(1,Math.pow((s/micData.length)/48,0.75));rafMic=requestAnimationFrame(loop);};loop();
}catch(e){}}
function stopMicMeter(){cancelAnimationFrame(rafMic);if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null;}targetLevel=0.08;}

/* ===== Reconocimiento de voz ===== */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let recog=null,listening=false;
function buildRecognizer(){if(!SR)return null;const r=new SR();r.lang='es-MX';r.interimResults=true;r.continuous=false;let finalText='';
  r.onstart=()=>{listening=true;setState(S.LISTEN);startMicMeter();};
  r.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const tr=e.results[i][0].transcript;
    if(e.results[i].isFinal)finalText+=tr;else interim+=tr;}
    statusEl.textContent=(finalText||interim)?'“'+(finalText||interim).trim()+'”':'Escuchando…';};
  r.onerror=e=>{listening=false;stopMicMeter();
    if(e.error==='not-allowed'||e.error==='service-not-allowed')addLine('','No tengo permiso para el micrófono. Actívalo o escríbeme abajo.','sys err');
    else if(e.error!=='aborted'&&e.error!=='no-speech')addLine('','No pude escucharte bien. Intenta otra vez o escríbeme.','sys err');
    setState(S.IDLE);};
  r.onend=()=>{listening=false;stopMicMeter();const said=finalText.trim();finalText='';
    if(said)handleUser(said);else{setState(S.IDLE);if(el('handsfree').checked)startListening();}};
  return r;}
function startListening(){if(listening||state===S.THINK||state===S.SPEAK)return;
  if(!SR){addLine('','Tu navegador no reconoce voz (usa Chrome o Edge). Mientras tanto, escríbeme abajo.','sys err');return;}
  recog=buildRecognizer();try{recog.start();}catch(e){}}
function stopListening(){if(recog&&listening){try{recog.stop()}catch(e){}}}

/* ===== Síntesis de voz ===== */
const synth=window.speechSynthesis; let voice=null;
const VOICE_RATE=1.0, VOICE_PITCH=1.0;     // tono natural y sereno estilo Gemini/Asistente
/* === Voz tipo Gemini con Google Cloud Text-to-Speech (opcional) ===
   1) Crea una clave (API key) en Google Cloud con la API "Cloud Text-to-Speech" habilitada.
   2) Pégala entre las comillas de GOOGLE_TTS_KEY. Si la dejas vacía, NOVA usa la voz del navegador.
   Voces Chirp3-HD (mismos nombres que Gemini): Kore, Aoede, Leda (femeninas) · Puck, Charon, Fenrir (masculinas). */
const GOOGLE_TTS_KEY='';                         // ← pega aquí tu clave de Google Cloud
const GOOGLE_TTS_LANG='es-US';                   // español latinoamericano
const GOOGLE_TTS_VOICE='es-US-Chirp3-HD-Kore';   // voz neural estilo Gemini (femenina)
const FEM=/(m[oó]nica|paulina|sabina|helena|laura|dalia|elvira|luc[ií]a|conchita|marisol|esperanza|pen[eé]lope|angelina|ximena|camila|sof[ií]a|google espa|mujer|female|femenin)/;
const MALE=/(jorge|diego|carlos|juan|pablo|enrique|miguel|[aá]lvaro|ra[uú]l|crist[oó]bal|hombre|\bmale\b|masculin)/;
let userPicked=false;
function pickVoice(){if(userPicked)return;const vs=synth.getVoices();if(!vs.length)return;
  const score=v=>{let s=0;const n=(v.name||'').toLowerCase(),l=(v.lang||'').toLowerCase();if(!l.startsWith('es'))return -999;
    if(MALE.test(n))s-=50;                       // descartar voces masculinas
    if(FEM.test(n))s+=20;                         // preferir voces femeninas
    if(/natural|neural|online|enhanced|premium/.test(n))s+=12;  // voces HD estilo asistente
    if(/google/.test(n))s+=40;                                             // voces Google: timbre tipo Gemini/Asistente
    if(/google espa[nñ]ol de estados/.test(n))s+=18;                        // la más parecida a Gemini (es-US)
    if(/es-mx|es-us|es-419|es-co|es-ar|es-cl|es-pe|es-ve/.test(l))s+=25;   // español latinoamericano (prioridad)
    if(/es-es/.test(l))s-=8;                                                // evitar acento de España
    if(/dalia|paloma|sabina|paulina/.test(n))s+=10;                         // voces LatAm agradables (respaldo)
    return s;};
  let best=null,bs=-1e9;for(const v of vs){const sc=score(v);if(sc>bs){bs=sc;best=v;}} if(best)voice=best;}
const HD=/natural|neural|online|enhanced|premium|google/;
function populateVoices(){const sel=el('voiceSel');if(!sel)return;const vs=synth.getVoices();if(!vs.length)return;
  const rank=v=>{const n=(v.name||'').toLowerCase();let s=0;if(HD.test(n))s+=2;if(FEM.test(n))s+=1;return s;};
  const es=vs.filter(v=>(v.lang||'').toLowerCase().startsWith('es')).sort((a,b)=>rank(b)-rank(a));
  const rest=vs.filter(v=>!(v.lang||'').toLowerCase().startsWith('es')).sort((a,b)=>rank(b)-rank(a));
  const list=[...es,...rest];
  sel.innerHTML='';
  list.forEach(v=>{const o=document.createElement('option');o.value=v.name+'|'+v.lang;const n=(v.name||'').toLowerCase();
    const tag=(HD.test(n)?'✨ ':'')+(FEM.test(n)?'♀ ':'');o.textContent=tag+v.name+' · '+v.lang;sel.appendChild(o);});
  if(!userPicked&&voice)sel.value=voice.name+'|'+voice.lang;}
function refreshVoices(){pickVoice();populateVoices();}
if(synth){refreshVoices();synth.onvoiceschanged=refreshVoices;}
el('voiceSel').addEventListener('change',e=>{const [nm,lg]=e.target.value.split('|');
  const v=synth.getVoices().find(x=>x.name===nm&&x.lang===lg);
  if(v){voice=v;userPicked=true;
    const u=new SpeechSynthesisUtterance('Hola, esta es mi voz.');u.voice=v;u.lang=v.lang;u.rate=VOICE_RATE;u.pitch=VOICE_PITCH;synth.cancel();synth.speak(u);}});
function splitSentences(txt){const m=txt.match(/[^.!?…]+[.!?…]*/g);return (m||[txt]).map(s=>s.trim()).filter(Boolean);}
function speak(text){
  if(el('mute').checked){setState(S.IDLE);if(el('handsfree').checked)startListening();return;}
  if(GOOGLE_TTS_KEY){speakGoogle(text);return;}   // voz neural tipo Gemini
  speakBrowser(text);
}
function speakBrowser(text){
  if(!synth){setState(S.IDLE);if(el('handsfree').checked)startListening();return;}
  setState(S.SPEAK);const parts=splitSentences(text);let i=0;
  const timer=setInterval(()=>{if(state===S.SPEAK)targetLevel=0.5+Math.random()*0.5;},80);
  function next(){if(i>=parts.length){clearInterval(timer);targetLevel=0.08;setState(S.IDLE);if(el('handsfree').checked)startListening();return;}
    const u=new SpeechSynthesisUtterance(parts[i++]);if(voice)u.voice=voice;u.lang=voice?voice.lang:'es-MX';u.rate=VOICE_RATE;u.pitch=VOICE_PITCH;
    u.onboundary=()=>{targetLevel=1.0;};u.onend=next;u.onerror=()=>{clearInterval(timer);setState(S.IDLE);};synth.speak(u);}
  synth.cancel();next();
}
let ttsAudio=null, ttsTimer=null;
async function speakGoogle(text){
  setState(S.SPEAK);
  clearInterval(ttsTimer);
  ttsTimer=setInterval(()=>{if(state===S.SPEAK)targetLevel=0.45+Math.random()*0.5;},80);
  try{
    const res=await fetch('https://texttospeech.googleapis.com/v1/text:synthesize?key='+encodeURIComponent(GOOGLE_TTS_KEY),{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({input:{text},voice:{languageCode:GOOGLE_TTS_LANG,name:GOOGLE_TTS_VOICE},audioConfig:{audioEncoding:'MP3'}})});
    if(!res.ok)throw new Error('TTS '+res.status);
    const data=await res.json();
    if(!data.audioContent)throw new Error('sin audio');
    if(ttsAudio){try{ttsAudio.pause()}catch(e){}}
    ttsAudio=new Audio('data:audio/mp3;base64,'+data.audioContent);
    ttsAudio.onended=()=>{clearInterval(ttsTimer);targetLevel=0.08;setState(S.IDLE);if(el('handsfree').checked)startListening();};
    ttsAudio.onerror=()=>{clearInterval(ttsTimer);targetLevel=0.08;setState(S.IDLE);};
    await ttsAudio.play();
  }catch(e){
    clearInterval(ttsTimer);
    addLine('','No pude generar la voz con Google ('+(e.message||e)+'). Reviso la clave o la conexión; uso la voz del navegador mientras tanto.','sys err');
    speakBrowser(text);
  }
}

/* ===== Cerebro: Claude ===== */
const SYSTEM=`Eres NOVA, un asistente de voz holográfico con un trato cálido, claro y servicial, al estilo de un asistente conversacional moderno.
Hablas SIEMPRE en español latinoamericano neutro, con trato de "tú" (nunca "vosotros"). Tus respuestas se LEEN EN VOZ ALTA, así que:
- Suena natural, serena y amable: tono conversacional y bien modulado, sin exagerar.
- Sé breve y claro: 1 a 3 frases, salvo que pidan más detalle.
- Da respuestas útiles y directas, explicando con naturalidad.
- Nada de markdown, listas, emojis, asteriscos ni símbolos. Solo texto hablado natural.
- Escribe números y signos como se pronuncian cuando ayude.
- Suena humana y fluida, como una conversación real.`;
async function askClaude(userText){history.push({role:'user',content:userText});
  const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,system:SYSTEM,messages:history.slice(-12)})});
  if(!res.ok)throw new Error('API '+res.status);
  const data=await res.json();
  const reply=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join(' ').trim();
  history.push({role:'assistant',content:reply});return reply||'Perdona, me quedé sin palabras un momento.';}
async function handleUser(text){addLine('',text,'you');setState(S.THINK);
  try{const reply=await askClaude(text);addLine('',reply,'nova');speak(reply);}
  catch(e){addLine('','No pude conectar con mi cerebro ahora mismo. Esto funciona dentro de la app de Claude; inténtalo de nuevo en un momento.','sys err');setState(S.IDLE);}}

/* ===== Eventos ===== */
micBtn.addEventListener('click',()=>{if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
  if(state===S.SPEAK){synth.cancel();setState(S.IDLE);return;}
  if(listening)stopListening();else if(state===S.IDLE)startListening();});
el('send').addEventListener('click',sendText);
el('txt').addEventListener('keydown',e=>{if(e.key==='Enter')sendText();});
function sendText(){const v=el('txt').value.trim();if(!v)return;el('txt').value='';stopListening();handleUser(v);}
el('handsfree').addEventListener('change',()=>{micLabel.textContent=el('handsfree').checked?'Conversación activa':'Toca para hablar';
  if(el('handsfree').checked&&state===S.IDLE)startListening();});
let greeted=false;
function greet(){if(greeted)return;greeted=true;const hi='Hola, soy NOVA. Toca el micrófono y pregúntame lo que quieras.';addLine('',hi,'nova');speak(hi);}
document.body.addEventListener('pointerdown',greet,{once:true});
